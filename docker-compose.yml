version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: batly-postgres
    environment:
      POSTGRES_USER: batly
      POSTGRES_PASSWORD: batly2026
      POSTGRES_DB: batly_enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: batly-backend
    environment:
      DATABASE_URL: postgresql://batly:batly2026@postgres:5432/batly_enterprise
      JWT_SECRET: batly-enterprise-secret-key-2026
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: batly-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
